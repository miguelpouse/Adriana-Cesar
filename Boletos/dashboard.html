<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - Adriana & César</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<!-- Librerías para generar el PDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html-to-image/1.11.11/html-to-image.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
    @font-face { font-family: 'CommercialScriptBT'; src: url('https://static.wfonts.com/data/2015/06/05/commercialscriptbt/CommercialScriptBT.ttf') format('truetype'); font-display: swap; }
    :root { --bg-color: #FDF9F1; --text-dark: #1B2A47; --accent: #B84F3E; --accent-alt: #5B7040; --gold: #D4AF37; --blush: #FDECEF; --white: #FFFFFF; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: var(--bg-color); color: var(--text-dark); text-align: center; font-family: 'Lato', sans-serif; padding: 30px 15px; min-height: 100vh; }
    h1 { font-family: 'CommercialScriptBT', 'Great Vibes', cursive, serif; font-size: 3rem; color: var(--accent); margin-bottom: 5px; }
    .container { max-width: 800px; margin: 0 auto; }
    
    /* Login */
    #loginBox { background: white; padding: 40px; border-radius: 16px; box-shadow: 0 10px 30px rgba(27,42,71,0.1); max-width: 400px; margin: 50px auto; border: 1.5px solid var(--gold); }
    #loginBox input { width: 100%; padding: 15px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 8px; font-size: 1rem; text-align: center; }
    #loginBox button { width: 100%; padding: 15px; background: var(--text-dark); color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 1.1rem; cursor: pointer; }
    
    /* Dashboard */
    #dashboardContent { display: none; }
    
    /* Top Bar (Botones de acción) */
    .top-bar { display: flex; justify-content: space-between; margin-bottom: 20px; }
    .btn-action { padding: 10px 20px; border: none; border-radius: 8px; font-size: 0.9rem; font-weight: 700; cursor: pointer; color: white; display: flex; align-items: center; gap: 8px; transition: transform 0.2s; }
    .btn-action:hover { transform: translateY(-2px); }
    .btn-pdf { background-color: var(--accent-alt); }
    .btn-logout { background-color: var(--accent); }

    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 20px; margin-bottom: 30px; }
    .stat-card { background: white; padding: 25px; border-radius: 16px; box-shadow: 0 10px 20px rgba(0,0,0,0.05); border-bottom: 4px solid var(--gold); }
    .stat-card h3 { font-size: 0.9rem; text-transform: uppercase; color: #888; margin-bottom: 10px; letter-spacing: 1px; }
    .stat-card .number { font-size: 3rem; font-weight: 900; color: var(--text-dark); line-height: 1; }
    
    .progress-container { background: white; padding: 30px; border-radius: 16px; box-shadow: 0 10px 20px rgba(0,0,0,0.05); margin-bottom: 30px; text-align: left; }
    .progress-bar { width: 100%; height: 20px; background: #eee; border-radius: 10px; overflow: hidden; margin-top: 10px; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-alt)); width: 0%; transition: width 1s ease; }
    
    .list-container { background: white; padding: 30px; border-radius: 16px; box-shadow: 0 10px 20px rgba(0,0,0,0.05); text-align: left; }
    .list-container h3 { font-size: 1.2rem; margin-bottom: 15px; color: var(--accent); border-bottom: 1px solid #eee; padding-bottom: 10px; }
    .guest-item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px dashed #eee; font-size: 1rem; }
    .guest-item:last-child { border-bottom: none; }
    .guest-item .name { font-weight: 700; }
    .guest-item .status { color: #d97706; font-weight: bold; font-size: 0.85rem; text-transform: uppercase; }
    .guest-item .status.in { color: #2e6b3e; }
    
    #errorBox { display: none; background: #ffcccc; color: #cc0000; padding: 15px; border-radius: 8px; margin-bottom: 20px; font-weight: bold; }
    
    .footer-text { margin-top: 20px; font-size: 0.8rem; color: #999; }
</style>
</head>
<body>

    <div class="container">
        <h1>Adriana & César</h1>
        <p style="text-transform: uppercase; letter-spacing: 2px; font-size: 0.8rem; color: #666; margin-bottom: 20px;">Panel de Control en Vivo</p>

        <!-- MENSAJE DE ERROR -->
        <div id="errorBox"></div>

        <!-- LOGIN -->
        <div id="loginBox">
            <h2 style="margin-bottom: 20px;">Ingresar</h2>
            <input type="password" id="passInput" placeholder="Contraseña del evento" onkeypress="if(event.key==='Enter') login()">
            <button onclick="login()">Entrar</button>
        </div>

        <!-- DASHBOARD -->
        <div id="dashboardContent">
            
            <!-- BARRA DE BOTONES (No saldrá en el PDF) -->
            <div class="top-bar" id="actionButtons">
                <button class="btn-action btn-pdf" onclick="descargarPDF()">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                    Descargar Resumen PDF
                </button>
                <button class="btn-action btn-logout" onclick="cerrarSesion()">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                    Cerrar Sesión
                </button>
            </div>

            <div class="stats-grid">
                <div class="stat-card">
                    <h3>Invitados Confirmados</h3>
                    <div class="number" id="statTotal">0</div>
                </div>
                <div class="stat-card">
                    <h3>Pases Emitidos</h3>
                    <div class="number" id="statPases">0</div>
                </div>
                <div class="stat-card">
                    <h3>Personas Adentro</h3>
                    <div class="number" id="statDentro">0</div>
                </div>
                <div class="stat-card" style="border-bottom-color: var(--accent);">
                    <h3>Por Llegar</h3>
                    <div class="number" id="statFaltan" style="color: var(--accent);">0</div>
                </div>
            </div>

            <div class="progress-container">
                <h3 style="font-size: 0.9rem; text-transform: uppercase; color: #888;">Progreso de Entrada</h3>
                <div class="progress-bar"><div class="progress-fill" id="progressBar"></div></div>
                <p style="text-align: right; font-size: 0.8rem; margin-top: 5px; font-weight: bold;" id="progressText">0%</p>
            </div>

            <div class="list-container">
                <h3>Lista de Espera (Aún no llegan)</h3>
                <div id="listaEspera" style="max-height: 400px; overflow-y: auto;">
                    <!-- Se llena con JS -->
                </div>
            </div>
            
            <p class="footer-text" id="lastUpdate">Actualizando...</p>
        </div>
    </div>

<script>
const SHEETS_API_URL = "https://script.google.com/macros/s/AKfycbzi70YReZnI0ImM-gPI3L3BDO5zpaBCi0wp61UxVkXqKl-eWned_BTFzckhN2F2kUt4rQ/exec";
const SECRET_KEY = "BodaAdrianaCesar2026"; 
const PASSWORD = "boda2026"; // 🔑 CAMBIA ESTA CONTRASEÑA

// --- MANEJO DE SESIÓN ---
document.addEventListener("DOMContentLoaded", () => {
    if (localStorage.getItem("dashboardAuth") === "true") {
        mostrarDashboard();
    }
});

function login() {
    const pass = document.getElementById("passInput").value;
    if (pass === PASSWORD) {
        localStorage.setItem("dashboardAuth", "true"); // Guarda la sesión
        mostrarDashboard();
    } else {
        alert("Contraseña incorrecta");
    }
}

function mostrarDashboard() {
    document.getElementById("loginBox").style.display = "none";
    document.getElementById("dashboardContent").style.display = "block";
    cargarDashboard();
    // ACTUALIZACIÓN CADA 10 SEGUNDOS
    setInterval(cargarDashboard, 10000); 
}

function cerrarSesion() {
    localStorage.removeItem("dashboardAuth");
    window.location.reload();
}

function mostrarError(msg) {
    const errorBox = document.getElementById("errorBox");
    errorBox.innerText = "⚠️ " + msg;
    errorBox.style.display = "block";
}

function normalizar(s) {
    if (!s) return "";
    let str = s.toString().toLowerCase();
    str = str.replace(/[áàäâ]/g, "a").replace(/[éèëê]/g, "e").replace(/[íìïî]/g, "i")
             .replace(/[óòöô]/g, "o").replace(/[úùüû]/g, "u").replace(/ñ/g, "n")
             .replace(/[^a-z0-9 ]/g, "").replace(/\s+/g, " ").trim();
    return str;
}

async function cargarDashboard() {
    try {
        const url = SHEETS_API_URL + "?action=all&clave=" + SECRET_KEY + "&t=" + new Date().getTime();
        const resp = await fetch(url);
        
        if (!resp.ok) throw new Error("Error HTTP " + resp.status);
        
        const text = await resp.text();
        
        if (text.includes("accounts.google.com") || text.includes("<!DOCTYPE html>")) {
            throw new Error("El Apps Script no es público. Ve a Implementar -> Gestionar Implementaciones.");
        }

        const data = JSON.parse(text);

        if (data.result === "error") throw new Error("Error del servidor: " + data.message);
        if (!Array.isArray(data) || data.length === 0) {
            mostrarError("La hoja de Google está vacía.");
            return;
        }

        document.getElementById("errorBox").style.display = "none";

        let totalConfirmados = 0;
        let totalPases = 0;
        let adentro = 0;
        let faltantes = [];

        data.forEach(r => {
            const asistencia = normalizar(r["Asistencia"]);
            
            if (asistencia.includes("si") && !asistencia.includes("no")) {
                totalConfirmados++;
                
                let pases = 1;
                const lleva = normalizar(r["Lleva acompañante"]);
                const acomp = r["Nombre de acompañante"] || "";
                
                if (lleva.includes("si") && acomp) {
                    pases += acomp.split(/,| y /).filter(n => n.trim() !== "").length;
                }
                totalPases += pases;

                const checkin = r["Check-in"] ? r["Check-in"].toString().trim() : "";
                if (checkin !== "") {
                    adentro += pases;
                } else {
                    faltantes.push({ nombre: r["Nombre"] || "Sin nombre", pases: pases });
                }
            }
        });

        document.getElementById("statTotal").innerText = totalConfirmados;
        document.getElementById("statPases").innerText = totalPases;
        document.getElementById("statDentro").innerText = adentro;
        document.getElementById("statFaltan").innerText = totalPases - adentro;

        const pct = totalPases > 0 ? Math.round((adentro / totalPases) * 100) : 0;
        document.getElementById("progressBar").style.width = pct + "%";
        document.getElementById("progressText").innerText = pct + "%";

        const lista = document.getElementById("listaEspera");
        lista.innerHTML = "";
        if (faltantes.length === 0) {
            lista.innerHTML = "<p style='text-align:center; color:#888;'>¡Todos han llegado!</p>";
        } else {
            faltantes.sort((a,b) => b.pases - a.pases);
            faltantes.forEach(f => {
                lista.innerHTML += `
                    <div class="guest-item">
                        <span class="name">${f.nombre}</span>
                        <span class="status">Faltan ${f.pases} pases</span>
                    </div>
                `;
            });
        }

        // Actualizar hora del último refresco
        const now = new Date();
        document.getElementById("lastUpdate").innerText = "Última actualización: " + now.toLocaleTimeString('es-MX');

    } catch (e) {
        console.error("Error cargando dashboard:", e);
        mostrarError(e.message);
    }
}

// --- DESCARGAR PDF ---
async function descargarPDF() {
    const elem = document.getElementById('dashboardContent');
    const btnPdf = document.querySelector('.btn-pdf');
    
    // 1. Mostrar estado de carga
    const originalText = btnPdf.innerHTML;
    btnPdf.innerHTML = "Generando...";
    btnPdf.disabled = true;

    // 2. Ocultar los botones temporalmente para que no salgan en el PDF
    const topBar = document.getElementById('actionButtons');
    topBar.style.display = 'none';

    try {
        // 3. Generar la imagen del Dashboard (usando html-to-image para mayor compatibilidad)
        const dataUrl = await htmlToImage.toPng(elem, { 
            backgroundColor: '#FDF9F1',
            pixelRatio: 2 
        });
        
        // 4. Crear el PDF
        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF('p', 'mm', 'a4');
        const imgProps = pdf.getImageProperties(dataUrl);
        const pdfWidth = pdf.internal.pageSize.getWidth();
        const pdfHeight = (imgProps.height * pdfWidth) / imgProps.width;

        // Si es muy largo, ajustar al alto de la hoja para que no se corte
        if (pdfHeight > pdf.internal.pageSize.getHeight()) {
            const ratio = pdf.internal.pageSize.getHeight() / imgProps.height;
            const newWidth = imgProps.width * ratio;
            pdf.addImage(dataUrl, 'PNG', (pdfWidth - newWidth) / 2, 0, newWidth, pdf.internal.pageSize.getHeight());
        } else {
            pdf.addImage(dataUrl, 'PNG', 0, 0, pdfWidth, pdfHeight);
        }

        pdf.save('Resumen_Boda_Adriana_Cesar.pdf');

    } catch (err) {
        console.error("Error generando PDF:", err);
        alert("Hubo un error al generar el PDF.");
    } finally {
        // 5. Restaurar la vista normal
        topBar.style.display = 'flex';
        btnPdf.innerHTML = originalText;
        btnPdf.disabled = false;
    }
}
</script>
</body>
</html>
