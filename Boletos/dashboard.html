<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Premium - Adriana & César</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet">
<!-- Librerías -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>

<style>
    @font-face { font-family: 'CommercialScriptBT'; src: url('https://static.wfonts.com/data/2015/06/05/commercialscriptbt/CommercialScriptBT.ttf') format('truetype'); font-display: swap; }
    :root { --bg-color: #FDF9F1; --text-dark: #1B2A47; --accent: #B84F3E; --accent-alt: #5B7040; --gold: #D4AF37; --blush: #FDECEF; --white: #FFFFFF; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: var(--bg-color); color: var(--text-dark); text-align: center; font-family: 'Lato', sans-serif; padding: 30px 15px; min-height: 100vh; }
    h1 { font-family: 'CommercialScriptBT', 'Great Vibes', cursive, serif; font-size: 3.5rem; color: var(--accent); margin-bottom: 0; line-height: 1; }
    .container { max-width: 900px; margin: 0 auto; }
    
    /* Login */
    #loginBox { background: white; padding: 40px; border-radius: 16px; box-shadow: 0 10px 30px rgba(27,42,71,0.1); max-width: 400px; margin: 50px auto; border: 1.5px solid var(--gold); }
    #loginBox input { width: 100%; padding: 15px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 8px; font-size: 1rem; text-align: center; }
    #loginBox button { width: 100%; padding: 15px; background: var(--text-dark); color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 1.1rem; cursor: pointer; }
    
    /* Dashboard */
    #dashboardContent { display: none; }
    .top-bar { display: flex; justify-content: space-between; margin-bottom: 20px; align-items: center; }
    .btn-action { padding: 10px 20px; border: none; border-radius: 8px; font-size: 0.9rem; font-weight: 700; cursor: pointer; color: white; display: flex; align-items: center; gap: 8px; transition: transform 0.2s; }
    .btn-action:hover { transform: translateY(-2px); }
    .btn-pdf { background-color: var(--accent-alt); }
    .btn-logout { background-color: var(--accent); }

    /* Grid de estadísticas */
    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 25px; }
    .stat-card { background: white; padding: 20px 15px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); border-bottom: 4px solid var(--gold); transition: all 0.3s ease; }
    .stat-card h3 { font-size: 0.75rem; text-transform: uppercase; color: #888; margin-bottom: 5px; letter-spacing: 1px; }
    .stat-card .number { font-size: 2.5rem; font-weight: 900; color: var(--text-dark); line-height: 1; transition: color 0.3s; }
    
    /* Sección de gráfico y feed */
    .middle-section { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 25px; }
    .chart-container { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; height: 250px; }
    .feed-container { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); text-align: left; height: 250px; overflow-y: auto; }
    .feed-container h3 { font-size: 1rem; color: var(--accent-alt); margin-bottom: 15px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
    .feed-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px dashed #eee; font-size: 0.9rem; animation: fadeIn 0.5s ease; }
    .feed-item:last-child { border-bottom: none; }
    .feed-item .name { font-weight: 700; }
    .feed-item .time { font-size: 0.75rem; background: #EEF3E6; color: var(--accent-alt); padding: 2px 8px; border-radius: 10px; font-weight: bold; }
    @keyframes fadeIn { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }

    /* Tabs y Listas */
    .list-container { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); text-align: left; }
    .tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid #eee; }
    .tab-btn { padding: 10px 20px; background: none; border: none; font-size: 1rem; font-weight: 700; color: #888; cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -2px; transition: all 0.3s; }
    .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
    .tab-content { display: none; max-height: 400px; overflow-y: auto; }
    .tab-content.active { display: block; }
    
    .guest-item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px dashed #eee; font-size: 1rem; }
    .guest-item:last-child { border-bottom: none; }
    .guest-item .name { font-weight: 700; }
    .guest-item .status { font-weight: bold; font-size: 0.85rem; text-transform: uppercase; }
    .status.waiting { color: #d97706; }
    .status.in { color: #2e6b3e; }

    #errorBox { display: none; background: #ffcccc; color: #cc0000; padding: 15px; border-radius: 8px; margin-bottom: 20px; font-weight: bold; }
    .footer-text { margin-top: 20px; font-size: 0.8rem; color: #999; }
</style>
</head>
<body>

    <div class="container">
        <h1>Adriana & César</h1>
        <p style="text-transform: uppercase; letter-spacing: 2px; font-size: 0.8rem; color: #666; margin-bottom: 20px;">Panel de Control en Vivo</p>

        <div id="errorBox"></div>

        <!-- LOGIN -->
        <div id="loginBox">
            <h2 style="margin-bottom: 20px;">Ingresar</h2>
            <input type="password" id="passInput" placeholder="Contraseña del evento" onkeypress="if(event.key==='Enter') login()">
            <button onclick="login()">Entrar</button>
        </div>

        <!-- DASHBOARD -->
        <div id="dashboardContent">
            
            <div class="top-bar" id="actionButtons">
                <button class="btn-action btn-pdf" onclick="descargarPDF()">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
                    Descargar Reporte PDF
                </button>
                <button class="btn-action btn-logout" onclick="cerrarSesion()">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                    Cerrar Sesión
                </button>
            </div>

            <div class="stats-grid">
                <div class="stat-card">
                    <h3>Invitados Confirmados</h3>
                    <div class="number" id="statTotal">0</div>
                </div>
                <div class="stat-card">
                    <h3>Pases Emitidos</h3>
                    <div class="number" id="statPases">0</div>
                </div>
                <div class="stat-card">
                    <h3>Personas Adentro</h3>
                    <div class="number" id="statDentro" style="color: var(--accent-alt);">0</div>
                </div>
                <div class="stat-card" style="border-bottom-color: var(--accent);">
                    <h3>Por Llegar</h3>
                    <div class="number" id="statFaltan" style="color: var(--accent);">0</div>
                </div>
            </div>

            <div class="middle-section">
                <div class="chart-container">
                    <canvas id="myChart"></canvas>
                </div>
                <div class="feed-container" id="feedContainer">
                    <h3>Últimos ingresos</h3>
                    <div id="liveFeed">
                        <p style="color:#888; font-size:0.9rem;">Esperando ingresos...</p>
                    </div>
                </div>
            </div>

            <div class="list-container">
                <div class="tabs">
                    <button class="tab-btn active" onclick="switchTab('tabWait', this)">Aún no llegan (<span id="countWait">0</span>)</button>
                    <button class="tab-btn" onclick="switchTab('tabIn', this)">Ya están adentro (<span id="countIn">0</span>)</button>
                </div>
                
                <div id="tabWait" class="tab-content active">
                    <div id="listaEspera"></div>
                </div>
                <div id="tabIn" class="tab-content">
                    <div id="listaAdentro"></div>
                </div>
            </div>
            
            <p class="footer-text" id="lastUpdate">Actualizando...</p>
        </div>
    </div>

<script>
const SHEETS_API_URL = "https://script.google.com/macros/s/AKfycbzi70YReZnI0ImM-gPI3L3BDO5zpaBCi0wp61UxVkXqKl-eWned_BTFzckhN2F2kUt4rQ/exec";
const SECRET_KEY = "BodaAdrianaCesar2026"; 
const PASSWORD = "boda2026"; // 🔑 CONTRASEÑA DEL DASHBOARD

let myChart = null;
let globalData = [];
let lastDataString = ""; // Para evitar parpadeos si no hay datos nuevos

document.addEventListener("DOMContentLoaded", () => {
    if (localStorage.getItem("dashboardAuth") === "true") {
        mostrarDashboard();
    }
});

function login() {
    const pass = document.getElementById("passInput").value;
    if (pass === PASSWORD) {
        localStorage.setItem("dashboardAuth", "true");
        mostrarDashboard();
    } else {
        alert("Contraseña incorrecta");
    }
}

function mostrarDashboard() {
    document.getElementById("loginBox").style.display = "none";
    document.getElementById("dashboardContent").style.display = "block";
    cargarDashboard();
    setInterval(cargarDashboard, 10000); 
}

function cerrarSesion() {
    localStorage.removeItem("dashboardAuth");
    window.location.reload();
}

function switchTab(tabId, btn) {
    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(tabId).classList.add('active');
    btn.classList.add('active');
}

function normalizar(s) {
    if (!s) return "";
    let str = s.toString().toLowerCase();
    str = str.replace(/[áàäâ]/g, "a").replace(/[éèëê]/g, "e").replace(/[íìïî]/g, "i")
             .replace(/[óòöô]/g, "o").replace(/[úùüû]/g, "u").replace(/ñ/g, "n")
             .replace(/[^a-z0-9 ]/g, "").replace(/\s+/g, " ").trim();
    return str;
}

async function cargarDashboard() {
    try {
        const url = SHEETS_API_URL + "?action=all&clave=" + SECRET_KEY + "&t=" + new Date().getTime();
        const resp = await fetch(url);
        if (!resp.ok) throw new Error("Error HTTP");
        
        const text = await resp.text();
        if (text.includes("accounts.google.com") || text.includes("<!DOCTYPE html>")) {
            throw new Error("El Apps Script no es público.");
        }

        const data = JSON.parse(text);
        if (data.result === "error") throw new Error(data.message);

        document.getElementById("errorBox").style.display = "none";
        
        // --- TRUCO ANTI-PARPADEO: Comparar datos ---
        // Si los datos son exactamente iguales a los anteriores, no hacemos nada visualmente
        const dataString = JSON.stringify(data);
        if (dataString === lastDataString) {
            const now = new Date();
            document.getElementById("lastUpdate").innerText = "Última revisión: " + now.toLocaleTimeString('es-MX') + " (Sin cambios)";
            return;
        }
        lastDataString = dataString;
        globalData = data;

        let totalConfirmados = 0;
        let totalPases = 0;
        let adentro = 0;
        let faltantes = [];
        let llegaron = [];

        data.forEach(r => {
            const asistencia = normalizar(r["Asistencia"]);
            if (asistencia.includes("si") && !asistencia.includes("no")) {
                totalConfirmados++;
                
                let pases = 1;
                const lleva = normalizar(r["Lleva acompañante"]);
                const acomp = r["Nombre de acompañante"] || "";
                if (lleva.includes("si") && acomp) {
                    pases += acomp.split(/,| y /).filter(n => n.trim() !== "").length;
                }
                totalPases += pases;

                const checkin = r["Check-in"] ? r["Check-in"].toString().trim() : "";
                if (checkin !== "") {
                    adentro += pases;
                    llegaron.push({ nombre: r["Nombre"] || "Sin nombre", pases: pases, hora: checkin });
                } else {
                    faltantes.push({ nombre: r["Nombre"] || "Sin nombre", pases: pases });
                }
            }
        });

        // Actualizar números con una pequeña transición
        document.getElementById("statTotal").innerText = totalConfirmados;
        document.getElementById("statPases").innerText = totalPases;
        document.getElementById("statDentro").innerText = adentro;
        document.getElementById("statFaltan").innerText = totalPases - adentro;

        // Actualizar Gráfico de forma fluida
        actualizarGrafico(adentro, totalPases - adentro);

        // --- ACTUALIZAR LISTAS SIN PERDER EL SCROLL ---
        document.getElementById("countWait").innerText = faltantes.length;
        document.getElementById("countIn").innerText = llegaron.length;

        const listaW = document.getElementById("listaEspera");
        const listaI = document.getElementById("listaAdentro");
        
        // Guardar posición del scroll actual
        const scrollW = listaW.scrollTop;
        const scrollI = listaI.scrollTop;

        // Construir HTML en memoria
        let htmlW = "";
        if (faltantes.length === 0) htmlW = "<p style='color:#888;text-align:center;'>¡Todos han llegado!</p>";
        else {
            faltantes.sort((a,b) => b.pases - a.pases).forEach(f => {
                htmlW += `<div class="guest-item"><span class="name">${f.nombre}</span><span class="status waiting">Faltan ${f.pases} pases</span></div>`;
            });
        }
        listaW.innerHTML = htmlW;

        let htmlI = "";
        if (llegaron.length === 0) htmlI = "<p style='color:#888;text-align:center;'>Nadie ha entrado aún.</p>";
        else {
            llegaron.sort((a,b) => new Date(b.hora) - new Date(a.hora)).forEach(l => {
                htmlI += `<div class="guest-item"><span class="name">${l.nombre}</span><span class="status in">Ingresó: ${l.hora}</span></div>`;
            });
        }
        listaI.innerHTML = htmlI;

        // Restaurar posición del scroll para que no "salte" la pantalla
        listaW.scrollTop = scrollW;
        listaI.scrollTop = scrollI;

        // Actualizar Live Feed
        const feed = document.getElementById("liveFeed");
        const feedContainer = document.getElementById("feedContainer");
        const feedScroll = feedContainer.scrollTop;

        if (llegaron.length === 0) {
            feed.innerHTML = "<p style='color:#888; font-size:0.9rem;'>Esperando ingresos...</p>";
        } else {
            let htmlFeed = "";
            llegaron.slice(0, 5).forEach(l => {
                htmlFeed += `<div class="feed-item"><span class="name">${l.nombre}</span><span class="time">${l.hora}</span></div>`;
            });
            feed.innerHTML = htmlFeed;
        }
        feedContainer.scrollTop = feedScroll;

        const now = new Date();
        document.getElementById("lastUpdate").innerText = "Última actualización: " + now.toLocaleTimeString('es-MX');

    } catch (e) {
        console.error(e);
        document.getElementById("errorBox").innerText = "⚠️ " + e.message;
        document.getElementById("errorBox").style.display = "block";
    }
}

// --- GRÁFICO FLUIDO ---
function actualizarGrafico(dentro, faltan) {
    const ctx = document.getElementById('myChart').getContext('2d');
    
    if (myChart) {
        myChart.data.datasets[0].data = [dentro, faltan];
        myChart.update('none'); // 'none' evita que el gráfico haga una animación brusca
    } else {
        myChart = new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: ['Adentro', 'Por llegar'],
                datasets: [{
                    data: [dentro, faltan],
                    backgroundColor: ['#5B7040', '#FDF9F1'],
                    borderColor: ['#5B7040', '#D4AF37'],
                    borderWidth: 2,
                    hoverOffset: 4
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                cutout: '70%',
                animation: { duration: 0 }, // Sin animación para evitar saltos
                plugins: {
                    legend: { position: 'bottom', labels: { font: { family: 'Lato', size: 12, weight: 'bold' } } },
                    title: { display: true, text: 'Estado de Ingreso', font: { family: 'Lato', size: 14, weight: 'bold' }, color: '#1B2A47' }
                }
            }
        });
    }
}

// --- GENERAR PDF PROFESIONAL ---
async function descargarPDF() {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF('p', 'mm', 'letter');
    const pageWidth = doc.internal.pageSize.getWidth();
    
    doc.setFont("times", "italic");
    doc.setFontSize(32);
    doc.setTextColor(184, 79, 62);
    doc.text("Adriana & César", pageWidth / 2, 20, { align: "center" });
    
    doc.setFont("helvetica", "normal");
    doc.setFontSize(10);
    doc.setTextColor(100, 100, 100);
    const fecha = new Date().toLocaleString('es-MX');
    doc.text(`Reporte generado el: ${fecha}`, pageWidth / 2, 28, { align: "center" });
    
    doc.setDrawColor(212, 175, 55);
    doc.setLineWidth(0.5);
    doc.line(20, 32, pageWidth - 20, 32);

    doc.setFontSize(14);
    doc.setTextColor(27, 42, 71);
    doc.setFont("helvetica", "bold");
    doc.text("Resumen General", 20, 45);

    const totalPases = document.getElementById("statPases").innerText;
    const adentro = document.getElementById("statDentro").innerText;
    const faltan = document.getElementById("statFaltan").innerText;

    doc.setFontSize(12);
    doc.setFont("helvetica", "normal");
    doc.text(`• Pases emitidos en total: ${totalPases}`, 25, 55);
    doc.text(`• Personas que ya ingresaron: ${adentro}`, 25, 62);
    doc.text(`• Personas por llegar: ${faltan}`, 25, 69);

    doc.setFont("helvetica", "bold");
    doc.text("Lista de Espera (Aún no llegan)", 20, 85);
    
    let faltantesData = [];
    globalData.forEach(r => {
        const asist = normalizar(r["Asistencia"]);
        if (asist.includes("si") && !asist.includes("no") && (!r["Check-in"] || r["Check-in"].toString().trim() === "")) {
            let pases = 1;
            if (normalizar(r["Lleva acompañante"]).includes("si") && r["Nombre de acompañante"]) {
                pases += r["Nombre de acompañante"].split(/,| y /).filter(n => n.trim() !== "").length;
            }
            faltantesData.push([r["Nombre"] || "Sin nombre", pases.toString()]);
        }
    });

    doc.autoTable({
        startY: 90,
        head: [['Nombre del Invitado', 'Pases']],
        body: faltantesData,
        theme: 'striped',
        headStyles: { fillColor: [184, 79, 62], fontStyle: 'bold' },
        styles: { font: 'helvetica', fontSize: 10 }
    });

    let finalY = doc.lastAutoTable.finalY + 15;
    if (finalY > 240) { doc.addPage(); finalY = 20; }

    doc.setFont("helvetica", "bold");
    doc.text("Registro de Ingresos", 20, finalY);

    let llegaronData = [];
    globalData.forEach(r => {
        const asist = normalizar(r["Asistencia"]);
        if (asist.includes("si") && !asist.includes("no") && r["Check-in"] && r["Check-in"].toString().trim() !== "") {
            let pases = 1;
            if (normalizar(r["Lleva acompañante"]).includes("si") && r["Nombre de acompañante"]) {
                pases += r["Nombre de acompañante"].split(/,| y /).filter(n => n.trim() !== "").length;
            }
            llegaronData.push([r["Nombre"] || "Sin nombre", pases.toString(), r["Check-in"].toString()]);
        }
    });

    doc.autoTable({
        startY: finalY + 5,
        head: [['Nombre del Invitado', 'Pases', 'Hora de Ingreso']],
        body: llegaronData,
        theme: 'grid',
        headStyles: { fillColor: [91, 112, 64], fontStyle: 'bold' },
        styles: { font: 'helvetica', fontSize: 10 }
    });

    doc.save('Reporte_Boda_Adriana_Cesar.pdf');
}
</script>
</body>
</html>
