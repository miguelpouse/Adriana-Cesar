<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Premium - Adriana & César</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>

<style>
    @font-face { font-family: 'CommercialScriptBT'; src: url('https://static.wfonts.com/data/2015/06/05/commercialscriptbt/CommercialScriptBT.ttf') format('truetype'); font-display: swap; }
    :root { 
        --bg-color: #FDF9F1; 
        --text-dark: #1B2A47; 
        --accent: #B84F3E; 
        --accent-alt: #5B7040; 
        --gold: #D4AF37; 
        --blush: #FDECEF; 
        --white: #FFFFFF; 
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: var(--bg-color); color: var(--text-dark); text-align: center; font-family: 'Lato', sans-serif; padding: 30px 15px; min-height: 100vh; background-image: radial-gradient(circle at top right, rgba(212, 175, 55, 0.05), transparent 40%), radial-gradient(circle at bottom left, rgba(184, 79, 62, 0.05), transparent 40%); }
    h1 { font-family: 'CommercialScriptBT', 'Great Vibes', cursive, serif; font-size: 3.5rem; color: var(--accent); margin-bottom: 0; line-height: 1; }
    .container { max-width: 900px; margin: 0 auto; }
    
    #loginBox { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(10px); padding: 40px; border-radius: 16px; box-shadow: 0 15px 35px rgba(27,42,71,0.1); max-width: 400px; margin: 50px auto; border: 1px solid rgba(212, 175, 55, 0.4); }
    #loginBox input { width: 100%; padding: 15px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 8px; font-size: 1rem; text-align: center; }
    #loginBox button { width: 100%; padding: 15px; background: var(--text-dark); color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 1.1rem; cursor: pointer; }
    
    #dashboardContent { display: none; }
    .live-indicator { display: inline-flex; align-items: center; gap: 6px; font-size: 0.75rem; font-weight: 700; color: var(--accent-alt); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 15px; background: #EEF3E6; padding: 4px 12px; border-radius: 20px; }
    .live-dot { width: 8px; height: 8px; background: #2e6b3e; border-radius: 50%; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(46, 107, 62, 0.4); } 70% { box-shadow: 0 0 0 6px rgba(46, 107, 62, 0); } 100% { box-shadow: 0 0 0 0 rgba(46, 107, 62, 0); } }

    .top-bar { display: flex; justify-content: space-between; margin-bottom: 25px; align-items: center; }
    .btn-action { padding: 12px 22px; border: none; border-radius: 8px; font-size: 0.9rem; font-weight: 700; cursor: pointer; color: white; display: flex; align-items: center; gap: 8px; transition: all 0.2s; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    .btn-action:hover { transform: translateY(-2px); box-shadow: 0 6px 15px rgba(0,0,0,0.15); }
    .btn-pdf { background-color: var(--accent-alt); }
    .btn-logout { background-color: var(--accent); }

    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 25px; }
    .stat-card { background: white; padding: 20px 15px; border-radius: 12px; box-shadow: 0 8px 20px rgba(27,42,71,0.06); border-top: 4px solid var(--gold); position: relative; overflow: hidden; }
    .stat-card h3 { font-size: 0.75rem; text-transform: uppercase; color: #888; margin-bottom: 5px; letter-spacing: 1px; font-weight: 700; }
    .stat-card .number { font-size: 2.8rem; font-weight: 900; color: var(--text-dark); line-height: 1; }
    .stat-card:nth-child(1) { border-top-color: var(--gold); }
    .stat-card:nth-child(2) { border-top-color: var(--text-dark); }
    .stat-card:nth-child(3) { border-top-color: var(--accent-alt); }
    .stat-card:nth-child(4) { border-top-color: var(--accent); }

    .middle-section { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 25px; }
    .chart-container { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 8px 20px rgba(27,42,71,0.06); display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; height: 260px; }
    .feed-container { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 8px 20px rgba(27,42,71,0.06); text-align: left; height: 260px; overflow-y: auto; }
    .feed-container h3 { font-size: 1rem; color: var(--accent-alt); margin-bottom: 15px; border-bottom: 2px solid #f0f0f0; padding-bottom: 10px; display: flex; align-items: center; gap: 8px; }
    .feed-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px dashed #eee; font-size: 0.9rem; animation: slideIn 0.4s ease; }
    .feed-item:last-child { border-bottom: none; }
    .feed-item .name { font-weight: 700; color: var(--text-dark); }
    .feed-item .time { font-size: 0.75rem; background: #EEF3E6; color: var(--accent-alt); padding: 3px 10px; border-radius: 12px; font-weight: bold; }

    .list-container { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 8px 20px rgba(27,42,71,0.06); text-align: left; }
    .tabs { display: flex; gap: 10px; margin-bottom: 20px; background: #f4f4f4; padding: 5px; border-radius: 10px; width: fit-content; }
    .tab-btn { padding: 10px 20px; background: none; border: none; font-size: 0.95rem; font-weight: 700; color: #888; cursor: pointer; border-radius: 8px; transition: all 0.3s; }
    .tab-btn.active { background: white; color: var(--accent); box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .tab-content { display: none; max-height: 400px; overflow-y: auto; padding-right: 5px; }
    .tab-content.active { display: block; }
    
    .guest-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #f0f0f0; font-size: 1rem; }
    .guest-item:last-child { border-bottom: none; }
    .guest-info { display: flex; flex-direction: column; gap: 5px; }
    .guest-item .name { font-weight: 700; color: var(--text-dark); }
    .guest-item .status { font-weight: bold; font-size: 0.75rem; text-transform: uppercase; padding: 3px 8px; border-radius: 4px; width: fit-content;}
    .status.waiting { color: var(--accent); background: var(--blush); }
    .status.in { color: var(--accent-alt); background: #EEF3E6; }
    
    .btn-download {
        display: inline-flex; align-items: center; gap: 5px; background-color: var(--accent-alt); color: white;
        font-size: 0.75rem; font-weight: 700; padding: 6px 12px; border-radius: 6px; text-decoration: none;
        transition: background 0.2s, transform 0.2s;
    }
    .btn-download:hover { background-color: #465934; transform: scale(1.05); }
    .btn-download.disabled { background-color: #ccc; pointer-events: none; opacity: 0.7; }

    #errorBox { display: none; background: var(--blush); color: var(--accent); padding: 15px; border-radius: 8px; margin-bottom: 20px; font-weight: bold; border: 1px solid rgba(184,79,62,0.2); }
    .footer-text { margin-top: 20px; font-size: 0.8rem; color: #999; }

    @media (max-width: 768px) {
        .stats-grid { grid-template-columns: 1fr 1fr; }
        .middle-section { grid-template-columns: 1fr; }
        .top-bar { flex-direction: column; gap: 10px; }
        .btn-action { width: 100%; justify-content: center; }
        .guest-item { flex-direction: column; align-items: flex-start; gap: 10px; }
    }
</style>
</head>
<body>

    <div class="container">
        <h1>Adriana & César</h1>
        <p style="text-transform: uppercase; letter-spacing: 2px; font-size: 0.8rem; color: #666; margin-bottom: 20px;">Panel de Control en Vivo</p>

        <div id="errorBox"></div>

        <div id="loginBox">
            <h2 style="margin-bottom: 20px; font-family: 'CommercialScriptBT', serif; font-size: 2rem; color: var(--accent);">Ingresar</h2>
            <input type="password" id="passInput" placeholder="Contraseña del evento" onkeypress="if(event.key==='Enter') login()">
            <button onclick="login()">Entrar</button>
        </div>

        <div id="dashboardContent">
            <div class="live-indicator"><div class="live-dot"></div> En vivo</div>

            <div class="top-bar" id="actionButtons">
                <button class="btn-action btn-pdf" onclick="descargarPDF()">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
                    Descargar Reporte PDF
                </button>
                <button class="btn-action btn-logout" onclick="cerrarSesion()">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                    Cerrar Sesión
                </button>
            </div>

            <div class="stats-grid">
                <div class="stat-card">
                    <h3>Invitados Confirmados</h3>
                    <div class="number" id="statTotal">0</div>
                </div>
                <div class="stat-card">
                    <h3>Pases Emitidos</h3>
                    <div class="number" id="statPases">0</div>
                </div>
                <div class="stat-card">
                    <h3>Personas Adentro</h3>
                    <div class="number" id="statDentro" style="color: var(--accent-alt);">0</div>
                </div>
                <div class="stat-card">
                    <h3>Por Llegar</h3>
                    <div class="number" id="statFaltan" style="color: var(--accent);">0</div>
                </div>
            </div>

            <div class="middle-section">
                <div class="chart-container">
                    <canvas id="myChart"></canvas>
                </div>
                <div class="feed-container" id="feedContainer">
                    <h3>
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7" r="4"></circle><polyline points="17 11 19 13 23 9"></polyline></svg>
                        Últimas llegadas
                    </h3>
                    <div id="liveFeed">
                        <p style="color:#888; font-size:0.9rem;">Esperando llegadas...</p>
                    </div>
                </div>
            </div>

            <div class="list-container">
                <div class="tabs">
                    <button class="tab-btn active" onclick="switchTab('tabWait', this)">Aún no llegan (<span id="countWait">0</span>)</button>
                    <button class="tab-btn" onclick="switchTab('tabIn', this)">Ya están adentro (<span id="countIn">0</span>)</button>
                </div>
                
                <div id="tabWait" class="tab-content active">
                    <div id="listaEspera"></div>
                </div>
                <div id="tabIn" class="tab-content">
                    <div id="listaAdentro"></div>
                </div>
            </div>
            
            <p class="footer-text" id="lastUpdate">Actualizando...</p>
        </div>
    </div>

<script>
const SHEETS_API_URL = "https://script.google.com/macros/s/AKfycbzi70YReZnI0ImM-gPI3L3BDO5zpaBCi0wp61UxVkXqKl-eWned_BTFzckhN2F2kUt4rQ/exec";
const SECRET_KEY = "BodaAdrianaCesar2026"; 
const PASSWORD = "boda2026"; 

let myChart = null;
let globalData = [];
let lastDataString = ""; 

document.addEventListener("DOMContentLoaded", () => {
    if (localStorage.getItem("dashboardAuth") === "true") {
        mostrarDashboard();
    }
});

function login() {
    const pass = document.getElementById("passInput").value;
    if (pass === PASSWORD) {
        localStorage.setItem("dashboardAuth", "true");
        mostrarDashboard();
    } else {
        alert("Contraseña incorrecta");
    }
}

function mostrarDashboard() {
    document.getElementById("loginBox").style.display = "none";
    document.getElementById("dashboardContent").style.display = "block";
    cargarDashboard();
    setInterval(cargarDashboard, 10000); 
}

function cerrarSesion() {
    localStorage.removeItem("dashboardAuth");
    window.location.reload();
}

function switchTab(tabId, btn) {
    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(tabId).classList.add('active');
    btn.classList.add('active');
}

function normalizar(s) {
    if (!s) return "";
    let str = s.toString().toLowerCase();
    str = str.replace(/[áàäâ]/g, "a").replace(/[éèëê]/g, "e").replace(/[íìïî]/g, "i")
             .replace(/[óòöô]/g, "o").replace(/[úùüû]/g, "u").replace(/ñ/g, "n")
             .replace(/[^a-z0-9 ]/g, "").replace(/\s+/g, " ").trim();
    return str;
}

function obtenerAcompanantes(r) {
    const lleva = normalizar(r["Lleva acompañante"]);
    const acomp = r["Nombre de acompañante"] || "";
    if (lleva.includes("si") && acomp) {
        return acomp.split(/,| y /).filter(n => n.trim() !== "").map(n => n.trim());
    }
    return [];
}

// Función para transformar el link de Drive en un link de descarga directa
function getDownloadLink(url) {
    if (!url) return null;
    const match = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
    if (match && match[1]) {
        return `https://drive.google.com/uc?export=download&id=${match[1]}`;
    }
    return url;
}

async function cargarDashboard() {
    try {
        const url = SHEETS_API_URL + "?action=all&clave=" + SECRET_KEY + "&t=" + new Date().getTime();
        const resp = await fetch(url);
        if (!resp.ok) throw new Error("Error HTTP");
        
        const text = await resp.text();
        if (text.includes("accounts.google.com") || text.includes("<!DOCTYPE html>")) {
            throw new Error("El Apps Script no es público.");
        }

        const data = JSON.parse(text);
        if (data.result === "error") throw new Error(data.message);

        document.getElementById("errorBox").style.display = "none";
        
        const dataString = JSON.stringify(data);
        if (dataString === lastDataString) {
            const now = new Date();
            document.getElementById("lastUpdate").innerText = "Última revisión: " + now.toLocaleTimeString('es-MX') + " (Sin cambios)";
            return;
        }
        lastDataString = dataString;
        globalData = data;

        let totalConfirmados = 0;
        let totalPases = 0;
        let adentro = 0;
        let faltantes = [];
        let llegaron = [];

        data.forEach(r => {
            const asistencia = normalizar(r["Asistencia"]);
            if (asistencia.includes("si") && !asistencia.includes("no")) {
                totalConfirmados++;
                
                const acompList = obtenerAcompanantes(r);
                let pases = 1 + acompList.length;
                totalPases += pases;

                const checkin = r["Check-in"] ? r["Check-in"].toString().trim() : "";
                // AQUI LEEMOS LA COLUMNA TICKET URL
                const rawTicketUrl = r["Ticket URL"] || "";
                const ticketUrl = getDownloadLink(rawTicketUrl);

                if (checkin !== "") {
                    adentro += pases;
                    llegaron.push({ nombre: r["Nombre"] || "Sin nombre", acomp: acompList, pases: pases, hora: checkin, ticketUrl: ticketUrl });
                } else {
                    faltantes.push({ nombre: r["Nombre"] || "Sin nombre", acomp: acompList, pases: pases, ticketUrl: ticketUrl });
                }
            }
        });

        document.getElementById("statTotal").innerText = totalConfirmados;
        document.getElementById("statPases").innerText = totalPases;
        document.getElementById("statDentro").innerText = adentro;
        document.getElementById("statFaltan").innerText = totalPases - adentro;

        actualizarGrafico(adentro, totalPases - adentro);

        document.getElementById("countWait").innerText = faltantes.length;
        document.getElementById("countIn").innerText = llegaron.length;

        const listaW = document.getElementById("listaEspera");
        const listaI = document.getElementById("listaAdentro");
        
        const scrollW = listaW.scrollTop;
        const scrollI = listaI.scrollTop;

        const btnHTML = (url) => url 
            ? `<a href="${url}" target="_blank" class="btn-download"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> Boleto</a>`
            : `<span class="btn-download disabled"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> Sin boleto</span>`;

        let htmlW = "";
        if (faltantes.length === 0) htmlW = "<p style='color:#888;text-align:center;'>¡Todos han llegado!</p>";
        else {
            faltantes.sort((a,b) => b.pases - a.pases).forEach(f => {
                htmlW += `<div class="guest-item">
                    <div class="guest-info">
                        <span class="name">${f.nombre}</span>
                        <span class="status waiting">Faltan ${f.pases} pases</span>
                    </div>
                    ${btnHTML(f.ticketUrl)}
                </div>`;
            });
        }
        listaW.innerHTML = htmlW;

        let htmlI = "";
        if (llegaron.length === 0) htmlI = "<p style='color:#888;text-align:center;'>Nadie ha entrado aún.</p>";
        else {
            llegaron.sort((a,b) => new Date(b.hora) - new Date(a.hora)).forEach(l => {
                htmlI += `<div class="guest-item">
                    <div class="guest-info">
                        <span class="name">${l.nombre}</span>
                        <span class="status in">Llegó: ${l.hora}</span>
                    </div>
                    ${btnHTML(l.ticketUrl)}
                </div>`;
            });
        }
        listaI.innerHTML = htmlI;

        listaW.scrollTop = scrollW;
        listaI.scrollTop = scrollI;

        const feed = document.getElementById("liveFeed");
        if (llegaron.length === 0) {
            feed.innerHTML = "<p style='color:#888; font-size:0.9rem;'>Esperando llegadas...</p>";
        } else {
            let htmlFeed = "";
            llegaron.slice(0, 5).forEach(l => {
                htmlFeed += `<div class="feed-item"><span class="name">${l.nombre}</span><span class="time">${l.hora}</span></div>`;
            });
            feed.innerHTML = htmlFeed;
        }

        const now = new Date();
        document.getElementById("lastUpdate").innerText = "Última actualización: " + now.toLocaleTimeString('es-MX');

    } catch (e) {
        console.error(e);
        document.getElementById("errorBox").innerText = "⚠️ " + e.message;
        document.getElementById("errorBox").style.display = "block";
    }
}

function actualizarGrafico(dentro, faltan) {
    const ctx = document.getElementById('myChart').getContext('2d');
    
    if (myChart) {
        myChart.data.datasets[0].data = [dentro, faltan];
        myChart.update('none');
    } else {
        myChart = new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: ['Adentro', 'Por llegar'],
                datasets: [{
                    data: [dentro, faltan],
                    backgroundColor: ['#5B7040', '#FDF9F1'],
                    borderColor: ['#5B7040', '#D4AF37'],
                    borderWidth: 2,
                    hoverOffset: 4
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                cutout: '75%',
                animation: { duration: 0 },
                plugins: {
                    legend: { position: 'bottom', labels: { font: { family: 'Lato', size: 12, weight: 'bold' }, padding: 20 } },
                    title: { display: true, text: 'Estado de Ingreso', font: { family: 'Lato', size: 14, weight: 'bold' }, color: '#1B2A47', padding: {bottom: 10} }
                }
            }
        });
    }
}

async function descargarPDF() {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF('p', 'mm', 'letter');
    const pageWidth = doc.internal.pageSize.getWidth();
    const pageHeight = doc.internal.pageSize.getHeight();
    
    doc.setFont("times", "italic");
    doc.setFontSize(36);
    doc.setTextColor(184, 79, 62);
    doc.text("Adriana & César", pageWidth / 2, 25, { align: "center" });
    
    doc.setFont("helvetica", "normal");
    doc.setFontSize(10);
    doc.setTextColor(100, 100, 100);
    const fecha = new Date().toLocaleString('es-MX');
    doc.text(`Reporte generado el: ${fecha}`, pageWidth / 2, 33, { align: "center" });
    
    doc.setDrawColor(212, 175, 55);
    doc.setLineWidth(0.8);
    doc.line(20, 38, pageWidth - 20, 38);

    const totalPases = document.getElementById("statPases").innerText;
    const adentro = document.getElementById("statDentro").innerText;
    const faltan = document.getElementById("statFaltan").innerText;

    doc.setFillColor(253, 249, 241);
    doc.roundedRect(20, 48, pageWidth - 40, 35, 3, 3, 'F');
    doc.setDrawColor(212, 175, 55);
    doc.setLineWidth(0.3);
    doc.roundedRect(20, 48, pageWidth - 40, 35, 3, 3, 'S');

    doc.setFontSize(14);
    doc.setTextColor(27, 42, 71);
    doc.setFont("helvetica", "bold");
    doc.text("Resumen del Evento", pageWidth / 2, 56, { align: "center" });

    doc.setFontSize(11);
    doc.setFont("helvetica", "bold");
    doc.setTextColor(27, 42, 71);
    doc.text(`Pases emitidos: ${totalPases}`, 25, 67);
    doc.setTextColor(91, 112, 64);
    doc.text(`Ya adentro: ${adentro}`, pageWidth / 2, 67, { align: "center" });
    doc.setTextColor(184, 79, 62);
    doc.text(`Por llegar: ${faltan}`, pageWidth - 25, 67, { align: "right" });

    doc.setFontSize(14);
    doc.setTextColor(27, 42, 71);
    doc.setFont("helvetica", "bold");
    doc.text("Invitados por Llegar", 20, 100);

    let faltantesData = [];
    globalData.forEach(r => {
        const asist = normalizar(r["Asistencia"]);
        if (asist.includes("si") && !asist.includes("no") && (!r["Check-in"] || r["Check-in"].toString().trim() === "")) {
            const acompList = obtenerAcompanantes(r);
            let pases = 1 + acompList.length;
            let acompTexto = acompList.length > 0 ? acompList.join(", ") : "—";
            faltantesData.push([r["Nombre"] || "Sin nombre", acompTexto, pases.toString()]);
        }
    });

    doc.autoTable({
        startY: 105,
        head: [['Invitado Principal', 'Acompañantes', 'Pases']],
        body: faltantesData,
        theme: 'grid',
        headStyles: { fillColor: [184, 79, 62], fontStyle: 'bold', fontSize: 11 },
        bodyStyles: { fontSize: 10, textColor: [50, 50, 50] },
        alternateRowStyles: { fillColor: [253, 249, 241] },
        columnStyles: { 0: { cellWidth: '40%' }, 1: { cellWidth: '45%' }, 2: { cellWidth: '15%', halign: 'center', fontStyle: 'bold' } },
        margin: { left: 20, right: 20 }
    });

    let finalY = doc.lastAutoTable.finalY + 15;
    if (finalY > 230) { doc.addPage(); finalY = 20; }

    doc.setFontSize(14);
    doc.setTextColor(27, 42, 71);
    doc.setFont("helvetica", "bold");
    doc.text("Registro de Llegadas (Adentro)", 20, finalY);

    let llegaronData = [];
    globalData.forEach(r => {
        const asist = normalizar(r["Asistencia"]);
        if (asist.includes("si") && !asist.includes("no") && r["Check-in"] && r["Check-in"].toString().trim() !== "") {
            const acompList = obtenerAcompanantes(r);
            let pases = 1 + acompList.length;
            let acompTexto = acompList.length > 0 ? acompList.join(", ") : "—";
            llegaronData.push([r["Nombre"] || "Sin nombre", acompTexto, pases.toString(), r["Check-in"].toString()]);
        }
    });

    doc.autoTable({
        startY: finalY + 5,
        head: [['Invitado Principal', 'Acompañantes', 'Pases', 'Hora de Llegada']],
        body: llegaronData,
        theme: 'grid',
        headStyles: { fillColor: [91, 112, 64], fontStyle: 'bold', fontSize: 11 },
        bodyStyles: { fontSize: 10, textColor: [50, 50, 50] },
        alternateRowStyles: { fillColor: [240, 245, 235] },
        columnStyles: { 0: { cellWidth: '35%' }, 1: { cellWidth: '35%' }, 2: { cellWidth: '12%', halign: 'center', fontStyle: 'bold' }, 3: { cellWidth: '18%', halign: 'center' } },
        margin: { left: 20, right: 20 }
    });

    const pageCount = doc.internal.getNumberOfPages();
    for (let i = 1; i <= pageCount; i++) {
        doc.setPage(i);
        doc.setFontSize(8);
        doc.setTextColor(150, 150, 150);
        doc.text(`Página ${i} de ${pageCount}`, pageWidth / 2, pageHeight - 10, { align: "center" });
        doc.text("Adriana & César - 14 de Noviembre de 2026", 20, pageHeight - 10);
    }

    doc.save('Reporte_Boda_Adriana_Cesar.pdf');
}
</script>
