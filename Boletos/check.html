<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Escáner de Boletos - Adriana & César</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">

<!-- Librería para leer el QR con la cámara -->
<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

<style>
    @font-face {
        font-family: 'CommercialScriptBT';
        src: url('https://static.wfonts.com/data/2015/06/05/commercialscriptbt/CommercialScriptBT.ttf') format('truetype');
        font-display: swap;
    }

    :root {
        --bg-color: #FDF9F1;
        --text-dark: #1B2A47;
        --accent: #B84F3E;
        --accent-alt: #5B7040;
        --gold: #D4AF37;
        --blush: #FDECEF;
        --white: #FFFFFF;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
        background-color: var(--bg-color);
        color: var(--text-dark);
        text-align: center;
        font-family: 'Lato', sans-serif;
        font-weight: 300;
        font-size: 1.1rem;
        line-height: 1.7;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 30px 15px;
    }

    h1, h2, h3 {
        font-family: 'CommercialScriptBT', 'Great Vibes', cursive, serif;
        letter-spacing: 1px;
    }

    h1 { font-size: clamp(2.8rem, 8vw, 4rem); color: var(--accent); line-height: 1.05; }
    h2 { font-size: 2.2rem; color: var(--accent); margin-bottom: 10px; }

    .hero-names {
        text-shadow: -0.4px -0.4px 0 var(--white), 0.4px -0.4px 0 var(--white), -0.4px  0.4px 0 var(--white), 0.4px  0.4px 0 var(--white);
    }

    .subtitle { font-size: 0.85rem; letter-spacing: 3px; text-transform: uppercase; color: var(--text-dark); opacity: 0.7; margin-bottom: 8px; }
    .hero-line { width: 50px; height: 1px; background-color: var(--gold); margin: 12px auto; opacity: 0.8; }

    .scanner-card {
        background: white;
        border-radius: 16px;
        padding: 30px 20px;
        box-shadow: 0 10px 30px rgba(27, 42, 71, 0.08);
        border: 1.5px solid var(--gold);
        width: 100%;
        max-width: 480px;
        margin-top: 20px;
        position: relative;
    }

    /* Contenedor de la cámara */
    #reader {
        width: 100%;
        border-radius: 12px;
        overflow: hidden;
        border: 2px solid var(--text-dark);
        background: #000;
        margin-bottom: 15px;
    }

    /* Ocultar el botón feo que pone la librería por defecto */
    #reader__dashboard_section_csr button { display: none; }
    #reader__dashboard_section_swaplink { display: none; }
    #reader__filescan_input { display: none; }

    .btn {
        display: inline-flex; align-items: center; justify-content: center; gap: 10px;
        background-color: var(--accent); color: white; padding: 14px 28px; border-radius: 6px;
        border: none; cursor: pointer; font-size: 0.95rem; letter-spacing: 1.5px; text-transform: uppercase;
        font-weight: 700; transition: background-color .3s, transform .2s; width: 100%; margin-top: 10px;
    }

    .btn:hover { background-color: #9A4132; transform: translateY(-2px); }
    .btn:disabled { opacity: .6; cursor: not-allowed; transform: none; }
    .btn-outline { background: transparent; color: var(--accent); border: 1.5px solid var(--accent); }

    /* Pantalla de resultado (Válido / Inválido) */
    #resultPanel {
        display: none;
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(255, 255, 255, 0.95);
        z-index: 1000;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 20px;
        text-align: center;
        backdrop-filter: blur(5px);
    }

    .result-icon {
        font-size: 6rem;
        margin-bottom: 10px;
        line-height: 1;
    }

    .result-title {
        font-size: 2.5rem;
        font-weight: 700;
        margin-bottom: 10px;
        text-transform: uppercase;
        letter-spacing: 2px;
    }

    .result-details {
        background: white;
        padding: 20px 30px;
        border-radius: 12px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        margin-bottom: 30px;
        border: 1px solid #eee;
        width: 100%;
        max-width: 400px;
    }

    .result-row {
        display: flex;
        flex-direction: column;
        margin-bottom: 10px;
        border-bottom: 1px solid #eee;
        padding-bottom: 10px;
    }
    .result-row:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }

    .result-label {
        font-size: 0.8rem;
        text-transform: uppercase;
        color: #888;
        letter-spacing: 1px;
    }
    .result-value {
        font-size: 1.2rem;
        font-weight: 700;
        color: var(--text-dark);
    }

    .success { color: #2e6b3e; }
    .error { color: var(--accent); }

    .hidden { display: none !important; }
</style>
</head>
<body>

    <div class="subtitle">Check-In</div>
    <h1 class="hero-names">Adriana & César</h1>
    <div class="hero-line"></div>
    <p style="font-size: 0.9rem; color: var(--text-dark); opacity: 0.7; margin-bottom: 15px;">Apunta la cámara al código QR del boleto</p>

    <div class="scanner-card">
        <div id="reader"></div>
        <button class="btn btn-outline" id="btnReiniciar" style="display: none;" onclick="reiniciarEscaner()">Escanear otro boleto</button>
    </div>

    <!-- PANEL DE RESULTADO -->
    <div id="resultPanel">
        <div class="result-icon" id="resIcon">✅</div>
        <div class="result-title" id="resTitle">VÁLIDO</div>
        
        <div class="result-details">
            <div class="result-row">
                <span class="result-label">Invitado Principal</span>
                <span class="result-value" id="resNombre">—</span>
            </div>
            <div class="result-row" id="resRowAcomp">
                <span class="result-label">Acompañante(s)</span>
                <span class="result-value" id="resAcomp">—</span>
            </div>
        </div>

        <button class="btn btn-dark" id="btnEscanearOtro">Escanear Siguiente</button>
    </div>

<script>
// --- CONFIGURACIÓN (Los mismos datos de tu hoja) ---
const SHEETS_API_URL = "https://script.google.com/macros/s/AKfycbzi70YReZnI0ImM-gPI3L3BDO5zpaBCi0wp61UxVXqKl-eWned_BTFzckhN2F2kUt4rQ/exec";
const NOMBRE_COL       = "Nombre";
const ASISTENCIA_COL   = "Asistencia";
const ACOMPANANTE_COL  = "Lleva acompañante";
const NOMBRE_ACOMP_COL = "Nombre de acompañante";

let html5QrCode;
let escaneando = false;

// Iniciar la cámara cuando carga la página
document.addEventListener("DOMContentLoaded", () => {
    iniciarEscaner();
});

function normalizar(s) {
    return (s || "").toString().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, " ").trim();
}

function iniciarEscaner() {
    html5QrCode = new Html5Qrcode("reader");
    
    const config = { 
        fps: 10, 
        qrbox: { width: 250, height: 250 },
        aspectRatio: 1.0
    };

    html5QrCode.start(
        { facingMode: "environment" }, // Usar cámara trasera
        config,
        onScanSuccess,
        onScanError
    ).catch(err => {
        console.error("Error al iniciar cámara:", err);
        alert("No se pudo acceder a la cámara. Asegúrate de dar los permisos necesarios en tu navegador.");
    });
}

async function onScanSuccess(decodedText, decodedResult) {
    // Si ya estamos procesando uno, ignorar escaneos rápidos
    if (escaneando) return;
    escaneando = true;

    // Vibración para avisar que leyó el código (si el celular lo soporta)
    if (navigator.vibrate) navigator.vibrate(200);

    try {
        // 1. Buscar en Google Sheets
        const resp = await fetch(SHEETS_API_URL);
        if (!resp.ok) throw new Error("Error de red");
        
        const text = await resp.text();
        if (text.includes("accounts.google.com") || text.includes("<!DOCTYPE html>")) {
            throw new Error("Error de conexión con Google.");
        }

        const registros = JSON.parse(text);
        const buscado = normalizar(decodedText);
        
        // Buscar coincidencia exacta o parcial
        let match = registros.find(r => normalizar(r[NOMBRE_COL]) === buscado);
        if (!match) {
            match = registros.find(r => {
                const n = normalizar(r[NOMBRE_COL]);
                return n.includes(buscado) || buscado.includes(n);
            });
        }

        mostrarResultado(match, decodedText);

    } catch (err) {
        console.error("Error al buscar:", err);
        alert("Error de conexión al verificar el boleto. Revisa tu internet.");
        escaneando = false; // Liberar para intentar de nuevo
    }
}

function onScanError(errorMessage) {
    // Esta función se ejecuta muchas veces mientras busca un QR. La dejamos vacía.
}

function mostrarResultado(registro, textoEscaneado) {
    // 2. Detener la cámara temporalmente
    html5QrCode.stop().then(() => {
        const panel = document.getElementById("resultPanel");
        const icon = document.getElementById("resIcon");
        const title = document.getElementById("resTitle");
        const nombreEl = document.getElementById("resNombre");
        const acompEl = document.getElementById("resAcomp");
        const rowAcomp = document.getElementById("resRowAcomp");

        // Verificar si existe y si su asistencia es válida
        const esValido = registro && normalizar(registro[ASISTENCIA_COL]).includes("si") && !normalizar(registro[ASISTENCIA_COL]).includes("no");

        if (esValido) {
            // ES VÁLIDO
            icon.innerText = "✅";
            title.innerText = "VÁLIDO";
            title.className = "result-title success";
            
            nombreEl.innerText = registro[NOMBRE_COL];
            
            const llevaAcomp = normalizar(registro[ACOMPANANTE_COL]).includes("si");
            const nombreAcomp = registro[NOMBRE_ACOMP_COL];
            
            if (llevaAcomp && nombreAcomp) {
                acompEl.innerText = nombreAcomp;
                rowAcomp.style.display = "flex";
            } else {
                rowAcomp.style.display = "none";
            }

        } else {
            // NO VÁLIDO (No existe o no confirmó)
            icon.innerText = "❌";
            title.innerText = "INVÁLIDO";
            title.className = "result-title error";
            
            nombreEl.innerText = registro ? registro[NOMBRE_COL] : `No encontrado: "${textoEscaneado}"`;
            acompEl.innerText = "—";
            rowAcomp.style.display = "none";
        }

        panel.style.display = "flex";

    }).catch(err => console.error("Error al detener cámara:", err));
}

// Botones para escanear al siguiente
document.getElementById("btnEscanearOtro").addEventListener("click", () => {
    document.getElementById("resultPanel").style.display = "none";
    escaneando = false;
    html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: { width: 250, height: 250 } }, onScanSuccess, onScanError);
});

</script>
</body>
</html>
